# Render blueprint for PEG.
#
# Two services, because genblaze is Python-only and a single generation runs for
# minutes — far past any serverless timeout.
#
# Both are public `web` services: Render's Private Services are a paid feature,
# and on the free tier a private service also cannot be woken by an internal
# request once it idles down. So peg-service is reachable on the internet and is
# protected by PEG_SERVICE_TOKEN instead — a value Render generates once and
# syncs to peg-web, so the generation endpoints are not an open door onto our
# provider credits.
#
# Secrets are marked `sync: false`: Render prompts for them once in the
# dashboard and never stores them in this file.

services:
  # ------------------------------------------------------- generation service
  - type: web
    name: peg-service
    runtime: python
    plan: free
    rootDir: service
    # Only reachable from peg-web over the private network.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: GMI_API_KEY
        sync: false
      # Direct Bria access powers the dedicated Expand endpoint. Keep the
      # service bootable while this is unset so unrelated generation still
      # works; Extend Canvas reports a scoped configuration error instead.
      - key: BRIA_API_TOKEN
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        sync: false
      # GMI drops submits under load, so keep concurrency modest.
      - key: PEG_MAX_CONCURRENT_RUNS
        value: "2"
      # Generated once by Render and mirrored onto peg-web below.
      - key: PEG_SERVICE_TOKEN
        generateValue: true

  # ---------------------------------------------------------------- the app
  - type: web
    name: peg-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Set explicitly rather than via `fromService`. Both properties were tried
      # and neither yields a reachable address on the free tier: `hostport` gave
      # something peg-web could not resolve, and `host` returns the bare internal
      # name `peg-service` with no domain. The public hostname is verified
      # working, and because requests arrive over the internet they also wake the
      # service from free-tier idle, which an internal call would not do.
      # If peg-service is ever renamed, this must be updated with it.
      - key: PEG_SERVICE_URL
        value: https://peg-service.onrender.com
      # Mirrors the value generated on peg-service so both sides share a secret.
      - key: PEG_SERVICE_TOKEN
        fromService:
          name: peg-service
          type: web
          envVarKey: PEG_SERVICE_TOKEN
      # Clerk. Keyless mode covers local development only — a deployed build
      # needs real keys, entered once in the Render dashboard. Organizations
      # must be enabled in Clerk: a workspace is an org, and the brand kit
      # belongs to it.
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Keep sign-in on the app's own pages rather than Clerk's hosted ones.
      # Read server-side by auth.protect(), so the ClerkProvider props are not
      # enough on their own — without these a deployed build sends users to
      # accounts.dev instead of the Astryx split page.
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
